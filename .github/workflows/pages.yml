name: Deploy Ataa site

on:
  push:
    branches:
      - main
    paths:
      - 'site/**'
      - 'tests/site/**'
      - '.github/workflows/pages.yml'
      - 'app/**'
      - 'tools/web/**'
      - '.github/workflows/website_checks.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  checks:
    name: website-checks
    uses: ./.github/workflows/website_checks.yml
    permissions:
      contents: read

  deploy:
    needs: checks
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      # Staff portal (Flutter web) under /admin/. It uses repository-level
      # variables only; this job deliberately does not use the `release`
      # environment (signing secrets, reviewer approval). Empty variables skip
      # the portal with a visible warning; invalid ones (for example a
      # service-role key) fail the deployment. A broken portal is never deployed.
      - name: Check admin portal configuration
        id: admin_cfg
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: python3 tools/web/admin_web.py check-config
      - name: Set up Flutter
        if: steps.admin_cfg.outputs.enabled == 'true'
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.3
          cache: false
      - name: Build admin portal
        if: steps.admin_cfg.outputs.enabled == 'true'
        working-directory: app
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          flutter pub get --enforce-lockfile
          flutter build web --release --base-href /admin/ --no-web-resources-cdn \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"
      - name: Add admin portal to the site
        if: steps.admin_cfg.outputs.enabled == 'true'
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
        run: python3 tools/web/admin_web.py finalize --build app/build/web --site site
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - name: Upload site
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
      - name: Verify public domain matches this deployment
        env:
          ADMIN_DEPLOYED: ${{ steps.admin_cfg.outputs.enabled }}
        run: python3 tests/site/check_deployed.py
      - name: Save public verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: website-deployment-verification
          path: deployment-results.json
          if-no-files-found: warn
          retention-days: 30
