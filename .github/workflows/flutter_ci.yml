name: Flutter CI

on:
  pull_request:
  push:
    branches:
      - main
      - feat/mvp-foundation

jobs:
  analyze:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
