name: Flutter CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - 'claude/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Validate Supabase migration versions
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          # Two accepted prefixes: the historical sequential 00NN_ form and the
          # Supabase CLI 14-digit UTC timestamp form (YYYYMMDDHHMMSS_). Both are
          # compared as numbers, because that is how the migration history
          # table orders and de-duplicates versions.
          declare -A seen
          sequential=0
          timestamped=0
          while IFS= read -r file; do
            name="${file##*/}"
            if [[ "$name" =~ ^([0-9]{4})_[a-z0-9_]+\.sql$ ]]; then
              sequential=$((sequential + 1))
            elif [[ "$name" =~ ^([0-9]{14})_[a-z0-9_]+\.sql$ ]]; then
              timestamped=$((timestamped + 1))
            else
              echo "::error file=$file::Migration filename must be 00NN_name.sql or YYYYMMDDHHMMSS_name.sql (lowercase letters, digits and underscores)."
              exit 1
            fi
            version="$((10#${BASH_REMATCH[1]}))"
            if [[ -n "${seen[$version]:-}" ]]; then
              echo "::error file=$file::Duplicate migration version $version also used by ${seen[$version]}."
              exit 1
            fi
            seen[$version]="$file"
          done < <(find supabase/migrations -maxdepth 1 -type f -name '*.sql' | sort)
          if [ "${#seen[@]}" -eq 0 ]; then
            echo "::error::No migrations found under supabase/migrations."
            exit 1
          fi
          echo "Validated ${#seen[@]} unique migration versions ($sequential sequential, $timestamped timestamped)."

      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.3
          cache: true

      - name: Flutter dependencies
        shell: bash
        run: |
          set -euo pipefail
          if [ -f pubspec.lock ]; then
            flutter pub get --enforce-lockfile
          else
            echo "::warning::app/pubspec.lock is not committed yet. Download the 'pubspec-lock' artifact from this run and commit it as app/pubspec.lock to make builds reproducible."
            flutter pub get
          fi

      # Uploaded before analyze/test so the resolved lockfile is available even
      # when a later step fails.
      - name: Upload resolved pubspec.lock
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pubspec-lock
          path: app/pubspec.lock
          if-no-files-found: error
          retention-days: 14

      - name: Analyze
        run: |
          set -o pipefail
          flutter analyze 2>&1 | tee "$RUNNER_TEMP/analyze.log"

      - name: Test
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          flutter test 2>&1 | tee "$RUNNER_TEMP/test.log"

      - name: Summarise findings as annotations
        if: ${{ !cancelled() }}
        working-directory: ${{ github.workspace }}
        run: |
          python3 tools/ci/annotate.py "flutter analyze" "$RUNNER_TEMP/analyze.log"
          python3 tools/ci/annotate.py "flutter test" "$RUNNER_TEMP/test.log"
          if ! git ls-files --error-unmatch app/pubspec.lock >/dev/null 2>&1; then
            python3 tools/ci/annotate.py "pubspec.lock" app/pubspec.lock full
          fi

      # Proves the staff portal (https://ruhamaa.com/admin/) compiles for the web
      # and stays self-contained before anything can be merged. Pages deploys
      # only from main, so this is the pre-merge guard. A placeholder project
      # host is used; no real configuration is needed to compile.
      - name: Build web staff portal (compile check)
        timeout-minutes: 15
        run: |
          set -euo pipefail
          flutter build web --release --base-href /admin/ --no-web-resources-cdn --no-pub
          echo "--- flutter_bootstrap.js lines of interest ---"
          grep -n -o -E '.{0,120}(gstatic|canvasKitBaseUrl|fontFallbackBaseUrl).{0,120}' build/web/flutter_bootstrap.js || true
          echo "--- end ---"
          python3 -m unittest ../tools/web/test_admin_web.py
          python3 ../tools/web/admin_web.py finalize \
            --build build/web --site "$RUNNER_TEMP/site-check" \
            --supabase-url https://example.supabase.co

      - name: Build Android debug APK
        timeout-minutes: 20
        run: flutter build apk --debug --no-pub

      - name: Upload debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ataa-debug-apk
          path: app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
