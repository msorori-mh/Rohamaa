name: Generate Android Scaffold

on:
  push:
    branches:
      - feat/mvp-foundation
    paths:
      - .github/workflows/generate_android_scaffold.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/mvp-foundation
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate clean Android host
        run: |
          rm -rf /tmp/sanad_android
          flutter create /tmp/sanad_android --platforms=android --org io.sanad --project-name app
          rm -rf app/android
          cp -R /tmp/sanad_android/android app/android
      - name: Configure location permission and OAuth deep link
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          if 'android.permission.ACCESS_FINE_LOCATION' not in s:
              s = s.replace('<manifest xmlns:android="http://schemas.android.com/apk/res/android">', '<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />')
          marker = '        </activity>'
          intent = '''            <intent-filter>\n                <action android:name="android.intent.action.VIEW" />\n                <category android:name="android.intent.category.DEFAULT" />\n                <category android:name="android.intent.category.BROWSABLE" />\n                <data android:scheme="io.sanad.app" android:host="login-callback" />\n            </intent-filter>\n'''
          if 'android:scheme="io.sanad.app"' not in s:
              s = s.replace(marker, intent + marker, 1)
          p.write_text(s)
          PY
      - name: Commit generated Android host
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/android
          if git diff --cached --quiet; then
            echo "No Android scaffold changes"
            exit 0
          fi
          git commit -m "build: add generated Android host [skip ci]"
          git push origin HEAD:feat/mvp-foundation
