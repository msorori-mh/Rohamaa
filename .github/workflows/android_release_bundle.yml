name: Android Release Bundle

# Manual, protected release build.
#
# Required configuration (see docs/ANDROID_RELEASE.md):
#   GitHub Environment `release` (required reviewers + deployment branch rule)
#     secrets: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
#              ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
#   Repository or `release` environment variables:
#     SUPABASE_URL, SUPABASE_ANON_KEY (public publishable key), AUTH_REDIRECT_URL

on:
  workflow_dispatch:
    inputs:
      build_name:
        description: Android versionName (MAJOR.MINOR.PATCH)
        required: true
        default: '0.1.0'
        type: string
      build_number:
        description: Android versionCode (must increase for each Play upload)
        required: true
        default: '1'
        type: string

permissions: {}

concurrency:
  group: android-release-bundle
  cancel-in-progress: false

jobs:
  guard:
    name: validate-ref-and-inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Refuse unprotected refs and malformed inputs
        shell: bash
        env:
          RELEASE_REF: ${{ github.ref }}
          BUILD_NAME: ${{ inputs.build_name }}
          BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          set -euo pipefail
          if [[ "$RELEASE_REF" != "refs/heads/main" && ! "$RELEASE_REF" =~ ^refs/tags/v ]]; then
            echo "::error::Release builds are only allowed from refs/heads/main or a v* tag (got: $RELEASE_REF)."
            exit 1
          fi
          if [[ ! "$BUILD_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::build_name must look like 1.2.3."
            exit 1
          fi
          if [[ ! "$BUILD_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "::error::build_number must be a positive integer."
            exit 1
          fi
          if (( ${#BUILD_NUMBER} > 10 || 10#$BUILD_NUMBER < 1 || 10#$BUILD_NUMBER > 2100000000 )); then
            echo "::error::build_number must be between 1 and 2100000000 (Google Play versionCode limit)."
            exit 1
          fi

  signed-aab:
    name: build-signed-aab
    needs: guard
    # Evaluated before the environment approval is requested.
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: release
    permissions:
      contents: read
    defaults:
      run:
        working-directory: app
    env:
      BUILD_NAME: ${{ inputs.build_name }}
      BUILD_NUMBER: ${{ inputs.build_number }}

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Verify release configuration
        shell: bash
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          AUTH_REDIRECT_URL: ${{ vars.AUTH_REDIRECT_URL }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0
          for name in SUPABASE_URL SUPABASE_ANON_KEY AUTH_REDIRECT_URL; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is empty. Set it as a repository or 'release' environment variable (Settings > Secrets and variables > Actions > Variables). A build without it shows only the startup configuration error screen."
              missing=1
            fi
          done
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is not configured as a secret of the 'release' environment."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          if [[ ! "$SUPABASE_URL" =~ ^https://[A-Za-z0-9.-]+$ ]]; then
            echo "::error::SUPABASE_URL must be an https origin without a path, for example https://<project-ref>.supabase.co."
            exit 1
          fi
          if [[ ! "$AUTH_REDIRECT_URL" =~ ^(com\.ruhamaa\.app://login-callback|https://ruhamaa\.com/login-callback/?)$ ]]; then
            echo "::error::AUTH_REDIRECT_URL must be com.ruhamaa.app://login-callback or https://ruhamaa.com/login-callback/."
            exit 1
          fi
          if [[ "$SUPABASE_ANON_KEY" =~ [[:space:]] ]]; then
            echo "::error::SUPABASE_ANON_KEY must not contain whitespace."
            exit 1
          fi
          # The value is compiled into the app, so it must be the public key.
          python3 - <<'PY'
          import base64, json, os, sys
          key = os.environ["SUPABASE_ANON_KEY"]
          role = None
          if key.startswith("sb_secret_"):
              role = "secret"
          elif key.count(".") == 2:
              try:
                  body = key.split(".")[1]
                  body += "=" * (-len(body) % 4)
                  role = json.loads(base64.urlsafe_b64decode(body)).get("role")
              except Exception:
                  role = None
          if role in ("secret", "service_role"):
              print("::error::SUPABASE_ANON_KEY holds a secret/service-role key. Only the public anon/publishable key may be shipped in the app.")
              sys.exit(1)
          PY

      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.3
          cache: false

      - name: Flutter dependencies
        shell: bash
        run: |
          set -euo pipefail
          if [ -f pubspec.lock ]; then
            flutter pub get --enforce-lockfile
          else
            echo "::warning::app/pubspec.lock is not committed; this release resolves dependency versions at build time."
            flutter pub get
          fi

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Materialize temporary upload keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/signing"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/signing/upload-keystore.jks"
          test -s "$RUNNER_TEMP/signing/upload-keystore.jks"

      - name: Build signed Android App Bundle
        shell: bash
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/signing/upload-keystore.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          AUTH_REDIRECT_URL: ${{ vars.AUTH_REDIRECT_URL }}
        run: |
          set -euo pipefail
          flutter build appbundle --release --no-pub \
            --build-name "$BUILD_NAME" \
            --build-number "$BUILD_NUMBER" \
            --obfuscate \
            --split-debug-info=build/symbols \
            --dart-define="SUPABASE_URL=$SUPABASE_URL" \
            --dart-define="SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY" \
            --dart-define="AUTH_REDIRECT_URL=$AUTH_REDIRECT_URL"

      - name: Remove temporary signing material
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/signing"

      - name: Verify bundle and emit digest
        shell: bash
        run: |
          set -euo pipefail
          test -s build/app/outputs/bundle/release/app-release.aab
          test -d build/symbols
          cd build/app/outputs/bundle/release
          sha256sum app-release.aab | tee app-release.aab.sha256

      - name: Upload signed AAB
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ataa-release-aab-${{ inputs.build_name }}-${{ inputs.build_number }}
          path: |
            app/build/app/outputs/bundle/release/app-release.aab
            app/build/app/outputs/bundle/release/app-release.aab.sha256
          if-no-files-found: error
          retention-days: 3

      # Needed to de-obfuscate Dart stack traces (flutter symbolize) and R8
      # traces for this exact build. Keep a private copy with the release notes.
      - name: Upload obfuscation symbols
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ataa-release-symbols-${{ inputs.build_name }}-${{ inputs.build_number }}
          path: |
            app/build/symbols/
            app/build/app/outputs/mapping/release/mapping.txt
          if-no-files-found: error
          retention-days: 30
