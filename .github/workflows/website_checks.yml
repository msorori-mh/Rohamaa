name: Website checks
on:
  pull_request:
    paths: ['site/**', 'tests/site/**', '.github/workflows/website_checks.yml', '.github/workflows/pages.yml']
  workflow_dispatch:
  # Reused by pages.yml so a deployment cannot start unless these checks pass.
  workflow_call:
permissions:
  contents: read
jobs:
  website:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'
      - name: Validate static pages
        run: python3 tests/site/check_static.py
      - name: Install browser test tool
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Check responsive pages and interactions
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 --directory site > /tmp/ruhamaa-site.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8765/ > /dev/null; then break; fi
            sleep 1
          done
          node tests/site/browser.cjs
      - name: Save screenshots and results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: website-review
          path: site-results/
          retention-days: 14
